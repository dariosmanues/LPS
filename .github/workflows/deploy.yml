name: Auto Deploy to VPS (177-202-246-42.sslip.io)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            echo "=== PERBAIKI SCRIPT UPDATE-AIRHITAM ==="
            cat << 'EOF' > /usr/local/bin/update-airhitam
            #!/bin/bash
            set -e
            echo '=== [1/3] Mengambil update terbaru dari GitHub (Airhitam)... ==='
            cd /var/www/timbangqr-airhitam
            git pull
            echo '=== [2/3] Build Next.js Production... ==='
            npm run build
            echo '=== [3/3] Reload PM2 (Zero Downtime)... ==='
            pm2 reload airhitam
            echo '========================================='
            echo '  SUCCESS: Airhitam Berhasil Di-update!  '
            echo '========================================='
            EOF
            chmod +x /usr/local/bin/update-airhitam
            echo "=== CEK DOMAIN NGINX ==="
            grep -rn "server_name" /etc/nginx/sites-enabled/

