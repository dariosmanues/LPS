name: Auto Deploy to VPS (177-202-246-42.sslip.io)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_deploy "${VPS_USER}@${VPS_HOST}" '
            set -e
            echo "🚀 Menjalankan pembaruan otomatis di VPS..."
            /usr/local/bin/update-airhitam
            if [ -d /var/www/timbangqr-ocr-led ]; then
              cp /var/www/timbangqr-airhitam/src/app/api/qr/\[token\]/route.ts /var/www/timbangqr-ocr-led/src/app/api/qr/\[token\]/route.ts
              cp /var/www/timbangqr-airhitam/src/lib/lps-qr-identity.ts /var/www/timbangqr-ocr-led/src/lib/lps-qr-identity.ts
              cp /var/www/timbangqr-airhitam/src/lib/lps-qr-integration.ts /var/www/timbangqr-ocr-led/src/lib/lps-qr-integration.ts
              cp /var/www/timbangqr-airhitam/src/lib/lps-sync.ts /var/www/timbangqr-ocr-led/src/lib/lps-sync.ts
              cp /var/www/timbangqr-airhitam/src/app/\(app\)/transaksi/\[id\]/page.tsx /var/www/timbangqr-ocr-led/src/app/\(app\)/transaksi/\[id\]/page.tsx
              cd /var/www/timbangqr-ocr-led && npm run build && pm2 reload ocr-led
            fi
            /usr/local/bin/update-lps
          '
          rm -f ~/.ssh/id_deploy

