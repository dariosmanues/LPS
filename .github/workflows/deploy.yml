name: Auto Deploy to VPS (177-202-246-42.sslip.io)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            echo "🚀 Menjalankan pembaruan otomatis di VPS..."
            /usr/local/bin/update-airhitam
            /usr/local/bin/update-lps
            echo "=== DAFTAR NGINX SITES ==="
            cat /etc/nginx/sites-enabled/* || true

